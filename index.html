<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的旅行足跡地圖</title>
<meta name="description" content="Q 版世界地圖：點國家放大看區域，每一本旅遊手冊就是一枚印章，記錄去過的國家與旅伴。">
<meta name="theme-color" content="#E8F3FF">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="我的旅行足跡地圖">
<meta property="og:description" content="點國家放大看區域・每一本旅遊手冊就是一枚印章">
<meta property="og:url" content="https://siderpan.github.io/travel-map/">
<meta property="og:image" content="https://siderpan.github.io/travel-map/icons/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Mochiy+Pop+One&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 和「富士東京冬日手帖」同一套貼紙手帳風 — 粗描邊 + 位移陰影、糖果色、圓點天空 */
:root{
  color-scheme:light;
  --bg:#E8F3FF; --dots:rgba(43,47,85,.07);
  --paper:#FFFFFF; --ink:#2B2F55; --muted:#62678C; --hair:#D6E0F2;
  --edge:#2B2F55; --shadow:3px 3px 0 #2B2F55; --shadow-lg:5px 5px 0 #2B2F55;
  --sky:#8EC9FF; --sky-soft:#DCEEFF; --ocean:#BFE2FF;
  --pink:#FF8FB8; --pink-soft:#FFE2ED;
  --sun:#FFD65A; --sun-soft:#FFF4CC;
  --mint:#6FD9A8; --mint-soft:#DBF6E9;
  --tang:#FF8A4C; --tang-soft:#FFE7D8;
  --lilac:#B6A3FF; --lilac-soft:#ECE6FF;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-pop:"Mochiy Pop One","Huninn","Noto Sans TC",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dots) 2px,transparent 2.5px);background-size:22px 22px;
  color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding:0 14px 60px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.25;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--tang);outline-offset:2px;border-radius:10px}
.card{background:var(--paper);border:2.5px solid var(--edge);border-radius:22px;box-shadow:var(--shadow)}
.sticker{display:inline-block;font-family:var(--f-pop);font-size:12px;line-height:1;padding:6px 10px 5px;border-radius:999px;border:2px solid var(--edge);background:var(--sun);color:var(--ink);transform:rotate(-3deg);box-shadow:2px 2px 0 var(--edge)}

/* ---------- header ---------- */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding:18px 2px 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:inherit;cursor:pointer;border-radius:18px}
.brand .globe{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.brand:hover .globe{transform:rotate(-26deg) scale(1.08)}
.brand:active .globe{transform:rotate(-8deg) scale(.94)}
.globe{width:62px;height:62px;flex:0 0 auto;transform:rotate(-8deg);filter:drop-shadow(3px 3px 0 var(--edge))}
header h1{font-size:clamp(26px,5.6vw,40px)}
header h1 .hl{background:linear-gradient(transparent 62%,var(--sun) 62%,var(--sun) 92%,transparent 92%);padding:0 2px}
header .sub{font-size:13px;color:var(--muted);margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:center;min-width:76px;padding:6px 12px 7px;border-radius:16px;border:2.5px solid var(--edge);background:var(--paper);box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s}
.stat:hover{transform:translate(-2px,-3px);box-shadow:5px 6px 0 var(--edge)}
.stat:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--edge)}
.stat[aria-current="page"]{transform:rotate(-3deg) translateY(-2px);box-shadow:4px 5px 0 var(--edge);outline:3px dashed var(--edge);outline-offset:3px}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.ctile{display:flex;align-items:center;gap:12px;text-align:left;border:2.5px solid var(--edge);border-radius:18px;background:var(--paper);padding:12px 14px;box-shadow:2px 2px 0 var(--edge);cursor:pointer;transition:transform .15s,box-shadow .15s}
.ctile:hover{transform:translate(-3px,-4px) rotate(-.6deg);box-shadow:6px 7px 0 var(--edge)}
.ctile:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--edge)}
.ctile h3{font-size:18px}
.homechip{display:inline-block;vertical-align:3px;font-family:var(--f-body);font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;border:2px solid var(--edge);background:var(--sky-soft)}
.ctile small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.rgroup{border:2.5px solid var(--edge);border-radius:18px;padding:12px 14px;background:var(--paper);box-shadow:2px 2px 0 var(--edge)}
.rgroup h3{display:flex;align-items:center;gap:8px;font-size:18px}
.rgroup .chip{cursor:pointer}
.rgroup .chip:hover{background:var(--pink)}
.rgroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.stat b{font-family:var(--f-pop);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;font-weight:700;color:var(--muted)}
.stat.p{background:var(--pink-soft)} .stat.s{background:var(--sun-soft)} .stat.m{background:var(--mint-soft)}

/* ---------- layout ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:980px){.main{grid-template-columns:minmax(0,1fr) 360px}}

/* ---------- map ---------- */
.mapcard{position:relative;overflow:hidden;padding:0;border-radius:26px;box-shadow:var(--shadow-lg)}
.maptools{position:absolute;z-index:4;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.maptools>*{pointer-events:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2.5px solid var(--edge);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:2px 2px 0 var(--edge);transition:transform .12s, box-shadow .12s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--edge)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--edge)}
.btn.pink{background:var(--pink)} .btn.sun{background:var(--sun)} .btn.mint{background:var(--mint)} .btn.sky{background:var(--sky)}
.btn.sm{padding:4px 11px;font-size:13px}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.search{position:relative;flex:1 1 180px;max-width:260px}
.search input::-webkit-calendar-picker-indicator{display:none!important;opacity:0}
.search input::-webkit-search-cancel-button{cursor:pointer}
.search input{width:100%;border:2.5px solid var(--edge);border-radius:999px;padding:6px 14px 6px 34px;background:var(--paper);box-shadow:2px 2px 0 var(--edge);font-size:14px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px}
.zoombtns{position:absolute;z-index:4;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoombtns .btn{width:36px;height:36px;padding:0;font-family:var(--f-pop);font-size:18px}
#map{display:block;width:100%;touch-action:none;cursor:grab;background:var(--ocean)}
#map:active{cursor:grabbing}
.sphere{fill:url(#oceanDots)}
.grat{fill:none;stroke:#fff;stroke-opacity:.55;stroke-dasharray:3 5;vector-effect:non-scaling-stroke}
[hidden]{display:none!important}
.shadow path.off{opacity:0}
.land path{stroke:var(--edge);stroke-width:1.3px;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;transition:fill .2s,opacity .25s}
.land path:hover{filter:brightness(1.06) saturate(1.2)}
.shadow path{fill:var(--edge);stroke:var(--edge);stroke-width:1.3px;vector-effect:non-scaling-stroke}
.land path.dim{opacity:.38}
.land path.focus{opacity:1}
.regions path{stroke:var(--edge);stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;transition:fill .2s}
.regions path:hover{fill:var(--sky)!important}
.regions path.hit-v{fill:var(--pink)!important}.regions path.hit-u{fill:var(--sun)!important}.regions path.hit-o{fill:var(--mint)!important}
.regions path.pick{fill:var(--mint)!important}
.rlabel{font-family:var(--f-display);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.rlabel.hit{font-weight:700}
.arc{fill:none;stroke:var(--edge);stroke-width:1.8px;stroke-dasharray:5 6;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.6;pointer-events:none}
.marker{cursor:pointer}
.marker .bob{animation:bob 2.4s ease-in-out infinite}
.marker:hover .bob{animation-duration:.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mk-text{font-family:var(--f-pop);font-size:12px;text-anchor:middle;dominant-baseline:central;fill:var(--ink);pointer-events:none}
.clabel{font-family:var(--f-display);font-size:13px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;text-anchor:middle;pointer-events:none}
.cloud{position:absolute;z-index:2;pointer-events:none;opacity:.9;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(calc(100vw + 140px))}}

/* ---------- cute ocean decorations ---------- */
.deco{pointer-events:none}
.deco .a{transform-box:fill-box;transform-origin:center}
.d-bob{animation:dbob 3s ease-in-out infinite}
@keyframes dbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.d-spout{transform-origin:50% 100%!important;animation:spout 2.8s ease-out infinite}
@keyframes spout{0%,45%{transform:scale(.2,0);opacity:0}55%{opacity:1}70%{transform:scale(1,1);opacity:1}100%{transform:scale(1.15,1.05);opacity:0}}
.d-rock{transform-origin:50% 90%!important;animation:rock 3.4s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) translateX(3px)}}
.d-jump{animation:jump 3.2s ease-in-out infinite}
@keyframes jump{0%,55%{transform:translate(-14px,10px) rotate(-50deg);opacity:0}60%{opacity:1;transform:translate(-12px,4px) rotate(-45deg)}75%{transform:translate(0,-16px) rotate(0)}90%{transform:translate(12px,4px) rotate(45deg);opacity:1}95%,100%{transform:translate(14px,10px) rotate(50deg);opacity:0}}
.d-splash{animation:splash 3.2s ease-out infinite}
@keyframes splash{0%,58%{transform:scale(.2);opacity:0}62%{opacity:.9}74%{transform:scale(1.2);opacity:0}86%{transform:scale(.2);opacity:0}91%{opacity:.9}100%{transform:scale(1.2);opacity:0}}
.d-sway{transform-origin:50% 0!important;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.d-wave{animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateX(-3px);opacity:.55}50%{transform:translateX(3px);opacity:1}}
.d-flap{animation:flap .5s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.4)}}
.d-drift{animation:drift2 9s ease-in-out infinite}
@keyframes drift2{0%,100%{transform:translate(-10px,0)}50%{transform:translate(12px,-6px)}}
.d-wiggle{transform-origin:50% 0!important;animation:wiggle 1.4s ease-in-out infinite alternate}
@keyframes wiggle{from{transform:skewX(-10deg)}to{transform:skewX(10deg)}}
.d-paddle{animation:paddle 1.2s ease-in-out infinite alternate}
@keyframes paddle{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.d-swim{animation:swim 7s ease-in-out infinite}
@keyframes swim{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.cloud,.marker .bob,.deco *{animation:none!important}.cloud{display:none}}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--paper);border:2px solid var(--edge);border-radius:12px;padding:4px 10px;font-size:13px;font-weight:700;box-shadow:2px 2px 0 var(--edge);white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));display:none}
.tip small{font-weight:500;color:var(--muted);margin-left:4px}
.crumb{position:absolute;z-index:4;left:10px;bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:calc(100% - 70px)}
.crumb .name{background:var(--paper);border:2.5px solid var(--edge);border-radius:14px;padding:3px 12px;font-family:var(--f-display);font-size:18px;box-shadow:2px 2px 0 var(--edge)}
.editbar{position:absolute;z-index:4;left:50%;top:56px;transform:translateX(-50%);background:var(--mint);border:2.5px solid var(--edge);border-radius:999px;padding:5px 14px;font-weight:700;font-size:13px;box-shadow:2px 2px 0 var(--edge);display:none;white-space:nowrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:2.5px solid var(--edge);background:var(--paper);border-radius:999px;padding:6px 16px;font-weight:700;font-size:14.5px;cursor:pointer;box-shadow:2px 2px 0 var(--edge);transition:transform .12s,box-shadow .12s}
.tab:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--edge)}
.tab[aria-current="page"]{background:var(--sun);transform:rotate(-2deg)}
.keybtn{flex:0 0 auto!important;padding:6px 11px!important}
.keybtn.on{background:var(--mint)}
.dlg{position:fixed;inset:0;z-index:50;background:rgba(43,47,85,.35);display:grid;place-items:center;padding:16px}
.dlg[hidden]{display:none}
.dlg .box{width:min(460px,100%);background:var(--paper);border:2.5px solid var(--edge);border-radius:22px;box-shadow:var(--shadow-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg .box p{margin:0;font-size:13.5px;color:var(--muted)}
.dlg .box{max-height:calc(100vh - 32px);overflow-y:auto;gap:14px!important}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{position:relative;padding:10px 12px 10px 46px;background:var(--sky-soft);border:2px solid var(--edge);border-radius:14px;font-size:13.5px;line-height:1.6;color:var(--ink);counter-increment:st}
.steps li::before{content:counter(st);position:absolute;left:10px;top:9px;width:26px;height:26px;border-radius:50%;border:2px solid var(--edge);background:var(--sun);display:grid;place-items:center;font-family:var(--f-pop);font-size:13px}
.steps li .btn{margin-top:8px;display:flex;width:max-content}
.steps code,.dlg p code{background:var(--paper);border:1.5px solid var(--hair);border-radius:6px;padding:0 5px;font-size:12.5px}
.tokfield{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;margin-top:4px}
.dlg input{border:2.5px solid var(--edge);border-radius:12px;padding:10px 12px;font-size:15px;width:100%;background:var(--paper)}
.dlgacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:14px;border-top:2px dashed var(--hair)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
@media (max-width:640px){.right{align-items:flex-start}}
@media (min-width:980px){.main.solo{grid-template-columns:minmax(0,1fr)}}
.stampbook{max-width:1180px}
.trip.link{transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
.trip.link:hover{transform:translate(-3px,-4px) rotate(-.4deg);box-shadow:6px 7px 0 var(--edge)}
.trip.link:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--edge)}
.trip.link:focus-within{outline:3px solid var(--tang);outline-offset:3px}
.trip .cover{position:absolute;inset:0;z-index:1;border-radius:16px}
.trip .cover:focus-visible{outline:none}
.trip .acts{position:relative;z-index:2}
.trip.hasfab{padding-right:62px;min-height:112px}
.trip.hasfab h3{padding-right:20px}
.mapfab{position:absolute;z-index:2;right:12px;bottom:12px;width:42px;height:42px;border-radius:50%;border:2.5px solid var(--edge);background:var(--sky);box-shadow:2px 2px 0 var(--edge);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .15s,box-shadow .15s}
.mapfab svg{width:20px;height:20px}
.mapfab.crewfab{bottom:62px;background:var(--mint)}
.trip.twofab{min-height:124px}
.crewpick{display:flex;flex-wrap:wrap;gap:8px}
.crewpick .cchip{font-size:14px;padding:3px 12px 3px 3px}
.crewpick .cchip .av{width:28px;height:28px;font-size:15px}
.mapfab:hover{transform:translate(-1px,-2px) rotate(-8deg);box-shadow:3px 4px 0 var(--edge);background:var(--sun)}
.mapfab:active{transform:translate(1px,1px);box-shadow:0 0 0 var(--edge)}
.crew{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.avs{display:flex}
.av{width:28px;height:28px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;font-size:15px;line-height:1;background:var(--paper);flex:0 0 auto}
.avs .av+.av{margin-left:-8px}
.av.me{background:var(--sun);font-family:var(--f-pop);font-size:11px;color:var(--ink)}
.av.lg{width:52px;height:52px;font-size:28px;border-width:2.5px;box-shadow:2px 2px 0 var(--edge)}
.cpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cchip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--edge);border-radius:999px;padding:2px 10px 2px 2px;background:var(--paper);font-size:13px;font-weight:700;cursor:pointer}
.cchip .av{width:24px;height:24px;font-size:13px;border-width:1.5px}
.cchip[aria-pressed="true"]{background:var(--mint);box-shadow:2px 2px 0 var(--edge)}
.quick{display:flex;gap:6px;margin-top:6px}
.quick input{flex:1;min-width:0}
.friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),210px));gap:18px 16px;padding-top:6px}
.friend{position:relative;align-items:center;text-align:center;gap:8px!important;padding:0 14px 14px!important;overflow:hidden;
  background:var(--fc,#FFE2ED)!important;background-image:radial-gradient(rgba(255,255,255,.55) 1.6px,transparent 2px)!important;background-size:14px 14px!important;
  border-radius:22px!important;box-shadow:3px 3px 0 var(--edge)!important;transition:transform .15s,box-shadow .15s}
.friend:not(.sorting):hover{transform:translateY(-3px) rotate(-.8deg);box-shadow:5px 6px 0 var(--edge)!important}
.badge-top{position:relative;align-self:stretch;margin:0 -14px;display:flex;justify-content:space-between;align-items:center;padding:16px 12px 7px;background:var(--paper);border-bottom:2.5px dashed var(--edge);font-family:var(--f-pop);font-size:10.5px;letter-spacing:.04em}
.badge-top .hole{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:34px;height:8px;border-radius:999px;border:2px solid var(--edge);background:var(--bg)}
.badge-top .bt-r{background:var(--ink);color:var(--paper);border-radius:999px;padding:2px 7px 1px}
.face{margin-top:8px}
.av.xl{width:78px;height:78px;font-size:44px;border-width:3px;box-shadow:3px 3px 0 var(--edge)}
.friend h3{font-size:21px;margin-top:2px}
.fstats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.fstats span{background:var(--paper);border:2px solid var(--edge);border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700}
.fstats b{font-family:var(--f-pop);font-weight:400}
.fstats .fnone{color:var(--muted);border-style:dashed;background:rgba(255,255,255,.6)}
.fseals{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.fseal{width:32px;height:32px;border-radius:50%;border:2px solid var(--edge);font-family:var(--f-pop);font-size:13px;cursor:pointer;padding:0;transform:rotate(-8deg);box-shadow:1.5px 1.5px 0 var(--edge);background:var(--paper)}
.fseal.v{background:var(--pink)} .fseal.u{background:var(--sun)} .fseal.o{background:var(--mint)}
.fseal:hover{transform:rotate(6deg) scale(1.12)}
.fnext{font-size:12px;font-weight:700;background:rgba(255,255,255,.7);border-radius:10px;padding:3px 8px}
.factions{display:flex;gap:6px;justify-content:center;margin-top:auto;padding-top:2px}

<div class="wrap">

<script>
(() => {
"use strict";
const HOME = "TWN";
// 還沒去的國家一律用同一個奶油色，顏色只用來表示旅行狀態（與圖例一致）
const UNVISITED = "#FFF8EC";
const STATUS_FILL = {v:"#FF8FB8",u:"#FFD65A",o:"#6FD9A8",n:"#ECE6FF"};
const STATUS_TXT = {v:"去過",u:"即將出發",o:"旅行中",n:"計畫中"};
const REGION_FILLS = ["#FFF8EC","#F7EEDD","#FDF3E4"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u||"").trim()) ? String(u).trim() : "";
const todayStr = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

const state = {
  trips: [], tripsLoaded: false, dbNote: "",
  db: null, canEdit: null, readOnly: false,
  view: "map",            // "map" | "stamps"
  focus: null,            // country id in zoomed mode
  regions: {},            // cache id -> features | null
  editing: null,          // {id?, country, title, url, start, end, note, regions:[{id,n}]}
  confirmDel: null, saving: false, formErr: "",
  companions: [], compForm: null, compConfirmDel: null, compErr: "", compSaving: false, sortIds: null, sortSaving: false
};

/* ---------- trips helpers ---------- */
function tripStatus(t){
  const today = todayStr();
  if (!t.start) return "n";
  const end = t.end || t.start;
  if (end < today) return "v";
  if (t.start > today) return "u";
  return "o";
}
function daysUntil(d){ const a = new Date(todayStr()+"T00:00:00"), b = new Date(d+"T00:00:00"); return Math.round((b-a)/864e5); }
function fmtRange(t){
  if (!t.start) return "日期未定";
  const f = s => s.replace(/-/g,"/");
  if (!t.end || t.end === t.start) return f(t.start);
  return f(t.start) + " – " + (t.end.slice(0,4) === t.start.slice(0,4) ? f(t.end.slice(5)) : f(t.end));
}
function countryStatus(id){
  const ts = state.trips.filter(t => t.country === id);
  if (id === HOME) return ts.some(t => tripStatus(t) === "o") ? "o" : "v";   // 出生地：一定算去過
  if (!ts.length) return null;
  const ss = ts.map(tripStatus);
  for (const k of ["o","v","u","n"]) if (ss.includes(k)) return k;
  return null;
}
function regionStatusMap(id){
  const m = new Map(), rank = {o:3, v:2, u:1};
  state.trips.filter(t => t.country === id && tripStatus(t) !== "n").forEach(t => {
    const s = tripStatus(t);
    (t.regions||[]).forEach(r => { if (!m.has(r.id) || rank[s] > rank[m.get(r.id)]) m.set(r.id, s); });
  });
  return m;
}
function visitedRegionIds(id){ return new Set(regionStatusMap(id).keys()); }

/* ---------- map setup ---------- */
const svg = d3.select("#map");
const defs = svg.append("defs");
const pat = defs.append("pattern").attr("id","oceanDots").attr("width",22).attr("height",22).attr("patternUnits","userSpaceOnUse");
pat.append("rect").attr("width",22).attr("height",22).attr("fill","#BFE2FF");
pat.append("circle").attr("cx",11).attr("cy",11).attr("r",1.6).attr("fill","#fff").attr("opacity",.7);
const zoomG = svg.append("g");
const sphereP = zoomG.append("path").attr("class","sphere");
const gratP = zoomG.append("path").attr("class","grat");
const shadowG = zoomG.append("g").attr("class","shadow");
const landG = zoomG.append("g").attr("class","land");
const regShadowG = zoomG.append("g").attr("class","shadow");
const regionG = zoomG.append("g").attr("class","regions");
const arcG = zoomG.append("g");
/* ---------- cute decorations (fixed size, placed by lon/lat) ---------- */
const decoG = zoomG.insert("g", () => arcG.node()).attr("class","deco");
const I = "#2B2F55", SW = 'stroke="#2B2F55" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"';
const WAVE = `<path d="M-14,0 q3.5,-4 7,0 t7,0 t7,0 t7,0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>`;
const DECOS = [
  {ll:[-150, 24], s:1.1, svg:`<ellipse cx="0" cy="15" rx="28" ry="4.5" fill="none" stroke="#fff" stroke-width="2.4"/>
    <g class="a d-bob">
      <g class="a d-spout"><path d="M-12,-14 q-3,-9 -10,-11 M-12,-14 q0,-10 0,-14 M-12,-14 q3,-9 10,-11" fill="none" stroke="#5FB4FF" stroke-width="3" stroke-linecap="round"/><circle cx="-23" cy="-26" r="2" fill="#5FB4FF"/><circle cx="-1" cy="-26" r="2" fill="#5FB4FF"/></g>
      <path d="M-26,2 C-26,-15 4,-17 14,-6 C17,-3 19,-4 24,-11 C27,-4 27,3 21,6 C27,8 27,14 23,17 C19,11 16,11 12,10 C3,17 -26,17 -26,2Z" fill="#8EC9FF" ${SW}/>
      <path d="M-23,7 C-14,13 2,13 10,9" fill="none" stroke="${I}" stroke-width="1.6" opacity=".45"/>
      <circle cx="-15" cy="-2" r="2.2" fill="${I}"/><ellipse cx="-10" cy="3.5" rx="3.2" ry="1.9" fill="#FF8FB8"/>
    </g>`},
  {ll:[-38, 27], s:1, svg:`<g class="a d-rock">
      <path d="M0,6 V-22" stroke="${I}" stroke-width="2.4"/>

/* ---------- regions ---------- */
async function loadRegions(id){
  if (id in state.regions) return state.regions[id];
  try {
    const r = await fetch("data/a1/" + id + ".json");
    if (!r.ok) throw 0;
    const topo = await r.json();
    const obj = Object.values(topo.objects)[0];
    const fc = topojson.feature(topo, obj).features.map(f => ({id: f.properties.id, n: f.properties.n || f.properties.en, en: f.properties.en, f}));
    state.regions[id] = fc;
  } catch(e){ state.regions[id] = null; }
  return state.regions[id];
}

function drawRegions(){
  const id = state.focus;
  const feats = id ? (state.regions[id] || []) : [];
  const rsm = id ? regionStatusMap(id) : new Map();
  const hits = new Set(rsm.keys());
  const picks = new Set((state.editing && state.editing.country === id) ? state.editing.regions.map(r => r.id) : []);
  regShadowG.selectAll("path").data(feats, d => d.id).join("path").attr("d", d => path(d.f));
  regionG.selectAll("path").data(feats, d => d.id).join("path")
    .attr("d", d => path(d.f))
    .attr("fill", (d, i) => REGION_FILLS[i % REGION_FILLS.length])
    .attr("class", d => (!state.editing && rsm.has(d.id)) ? "hit-" + rsm.get(d.id) : null)
    .classed("pick", d => picks.has(d.id))
    .on("mousemove", (ev, d) => showTip(ev, d.n + (hits.has(d.id) ? " ★" : ""), d.n !== d.en ? d.en : ""))
    .on("mouseleave", hideTip)
    .on("click", (ev, d) => { ev.stopPropagation(); if (state.editing) toggleRegion(d); else showTip(ev, d.n + (hits.has(d.id) ? " ★" : ""), d.n !== d.en ? d.en : ""); });
  const lab = feats.map(d => {
    const b = path.bounds(d.f); const c = path.centroid(d.f);
    return {id: d.id, n: d.n, x: c[0], y: c[1], screen: Math.min(b[1][0]-b[0][0], b[1][1]-b[0][1]), hit: hits.has(d.id)};
  }).filter(d => isFinite(d.x));
  regionG.selectAll("text").data(lab, d => d.id).join("text").attr("class", d => "rlabel" + (d.hit ? " hit" : ""))
    .attr("x", d => d.x).attr("y", d => d.y).text(d => (d.hit ? "★ " : "") + d.n);
  regionG.selectAll("text").raise();
  onZoomScale();
}

/* ---------- zoom helpers ---------- */
function mainBounds(feature){
  const g = feature.geometry;
  if (!g || g.type !== "MultiPolygon") return path.bounds(feature);
  const polys = g.coordinates.map(c => ({type:"Polygon", coordinates:c})).map(p => ({p, a: path.area(p)}));
  const max = d3.max(polys, d => d.a);
  const keep = polys.filter(d => d.a >= max * 0.12).map(d => d.p.coordinates);
  return path.bounds({type:"MultiPolygon", coordinates: keep});
}
function zoomToBounds(b, dur = 850){
  const dx = b[1][0]-b[0][0], dy = b[1][1]-b[0][1];
  const cx = (b[0][0]+b[1][0])/2, cy = (b[0][1]+b[1][1])/2;
  const k = Math.max(1, Math.min(220, 0.82 / Math.max(dx / W, dy / (H - 60))));
  const t = d3.zoomIdentity.translate(W/2 - k*cx, (H+40)/2 - k*cy).scale(k);
  svg.transition().duration(dur).ease(d3.easeCubicInOut).call(zoom.transform, t);
}

async function loadHiRes(){
  try {
    const topo = await (await fetch("data/world_hi.json")).json();
    const feats = topojson.feature(topo, Object.values(topo.objects)[0]).features;
    let n = 0;
    feats.forEach(f => { const c = byId.get(f.properties.id); if (c && f.geometry){ f.id = c.id; c.f = f; n++; } });
    if (n){ drawWorld(); }
  } catch(e){ /* keep the lighter outlines */ }
}
function homeT(){
  if (W >= 640) return d3.zoomIdentity;
  const b = path.bounds(WORLD_BOX), sh = b[1][1] - b[0][1];
  const k = Math.max(1, Math.min(2.4, (H - 70) / sh));
  const home = byId.get(HOME), p = home ? projection([home.lx, home.ly]) : [W/2, H/2];
  const cx = Math.max(b[0][0] + W/(2*k), Math.min(b[1][0] - W/(2*k), p[0] - 40/k));
  const cy = (b[0][1] + b[1][1]) / 2;
  return d3.zoomIdentity.translate(W/2 - k*cx, (H+30)/2 - k*cy).scale(k);
}
/* ---------- legend filter ---------- */
function statusKey(id){ return countryStatus(id) || "x"; }
function isDim(id){
  if (state.focus) return id !== state.focus;
  if (state.legendSt && state.legendSt !== "x") return statusKey(id) !== state.legendSt;
  return false;
}
let toastT;
function legendToast(msg){ const t = $("#ltoast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }
function showStatus(st){
  if (state.legendSt === st){ state.legendSt = null; paintWorld(); svg.transition().duration(700).ease(d3.easeCubicInOut).call(zoom.transform, homeT()); return; }
  const label = {v:"去過", u:"即將出發", o:"旅行中", n:"計畫中", x:"還沒去"}[st];
  const ids = st === "x" ? [] : countries.filter(c => statusKey(c.id) === st).map(c => c.id);
  if (st !== "x" && !ids.length){ legendToast(`目前沒有「${label}」的國家`); return; }
  if (state.focus || state.view !== "map"){
    state.focus = null; state.editing = null; state.confirmDel = null; state.view = "map";
    setHash(""); $("#backBtn").hidden = true; $("#crumb").innerHTML = ""; $("#editbar").style.display = "none";

  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  ids.forEach(id => { const b = mainBounds(byId.get(id).f); x0 = Math.min(x0, b[0][0]); y0 = Math.min(y0, b[0][1]); x1 = Math.max(x1, b[1][0]); y1 = Math.max(y1, b[1][1]); });
  const pad = Math.max(x1 - x0, y1 - y0) * 0.25 + 4;
  zoomToBounds([[x0 - pad, y0 - pad], [x1 + pad, y1 + pad]]);
  legendToast(`${label}：${ids.map(id => byId.get(id).n).join("、")}`);
}

async function openCountry(id, push = true){

function tripCard(t, inCountry){
  if (!inCountry) return stampCard(t);
  const s = tripStatus(t);
  const c = byId.get(t.country);
  const url = safeUrl(t.url);
  let badge = STATUS_TXT[s];
  if (s === "u"){ const d = daysUntil(t.start); badge = d === 1 ? "明天出發" : `倒數 ${d} 天`; }
  const regs = (t.regions||[]).map(r => `<span class="chip">${esc(r.n)}</span>`).join("");
  const canEdit = state.canEdit !== false && !state.readOnly && state.db;
  const delConfirm = state.confirmDel === t.id;
  const asLink = !inCountry && url;
  const crewBtn = !inCountry && canEdit ? `<button class="mapfab crewfab" data-crew="${esc(t.id)}" aria-label="編輯${esc(t.title || "這趟")}的旅伴" title="編輯旅伴"><svg viewBox="0 0 24 24" fill="none" stroke="#2B2F55" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.4 3-5.2 6-5.2s5.4 1.8 6 5.2"/><path d="M18 8v6M15 11h6"/></svg></button>` : "";
  const fab = !inCountry ? crewBtn + `<button class="mapfab" data-go="${esc(t.country)}" aria-label="在地圖上看${esc(c ? c.n : t.country)}" title="看地圖"><svg viewBox="0 0 24 24" fill="none" stroke="#2B2F55" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13.5L9 17.5l6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg></button>` : "";
  const acts = (asLink ? "" : url ? `<a class="btn pink sm" href="${esc(url)}" target="_blank" rel="noopener">📖 打開旅遊手冊 ↗</a>` : `<span class="chip" style="background:var(--hair)">還沒連結手冊</span>`)
    + (inCountry && canEdit ? `<button class="btn sm" data-edit="${esc(t.id)}">✏️ 編輯</button>
        <button class="btn sm ${delConfirm ? "pink" : "ghost"}" data-del="${esc(t.id)}">${delConfirm ? "確定刪除？" : "刪除"}</button>` : "");
  return `<article class="trip ${s}${asLink ? " link" : ""}${fab ? " hasfab" : ""}${crewBtn ? " twofab" : ""}">
    ${fab}
    ${asLink ? `<a class="cover" href="${esc(url)}" target="_blank" rel="noopener" aria-label="打開旅遊手冊：${esc(t.title || "未命名旅程")}"></a>` : ""}
    <span class="status ${s}">${esc(badge)}</span>
    <h3>${esc(t.title || "未命名旅程")}</h3>
    <div class="when">${inCountry ? "" : esc(c ? c.n : t.country) + "・"}${esc(fmtRange(t))}</div>
    ${t.note ? `<div class="tnote">${esc(t.note)}</div>` : ""}
    ${regs ? `<div class="chips">${regs}</div>` : ""}
    ${crewHtml(t)}
    ${acts ? `<div class="acts">${acts}</div>` : ""}
  </article>`;
}

function renderPanelInner(){

function compById(id){ return state.companions.find(c => c.id === id); }
function avatar(c, lg){
  const i = [...c.id].reduce((n, ch) => n + ch.charCodeAt(0), 0) % AV_BG.length;
  return `<span class="av${lg === "xl" ? " xl" : lg ? " lg" : ""}" style="background:${lg === "xl" ? "#fff" : AV_BG[i]}" aria-hidden="true">${esc(c.emoji)}</span>`;

const CARD_BG = ["#FFD3E3","#CFE6FF","#C9F0DC","#FFEDB0","#DED5FF","#FFD9C4"];
function compColor(c){ return CARD_BG[[...c.id].reduce((n, ch) => n + ch.charCodeAt(0), 0) % CARD_BG.length]; }
function crewHtml(t){
  const cs = (t.companions || []).map(compById).filter(Boolean);
  const avs = `<span class="avs"><span class="av me" title="我">我</span>${cs.slice(0, 5).map(c => avatar(c)).join("")}</span>`;
  const names = cs.length ? "和 " + cs.map(c => esc(c.name)).join("、") : "一個人的旅行";
  return `<div class="crew">${avs}<span>${names}</span></div>`;
}
function compErrText(err){
  if (err && err.code === "invalid_argument") return "沒有寫入權限：請按右上角 🔑 重新輸入 GitHub 金鑰。";
  if (err && err.code === "quota_exceeded") return "儲存空間已滿。";
  return "儲存失敗，請稍後再試一次。";
}
async function createCompanion(name, emoji){
  try {
    const ref = state.db.collection("companions").doc();
    const maxOrd = state.companions.reduce((m, c) => Math.max(m, c.order ?? -1), state.companions.length - 1);
    await ref.set({name: name.slice(0, 20), emoji, order: maxOrd + 1, createdAt: new Date().toISOString()});
    return ref.id;
  } catch(err){ state.compErr = compErrText(err); state.formErr = compErrText(err); renderPanel(); return null; }
}
async function deleteCompanion(id){
  try {
    for (const t of state.trips.filter(t => t.companions.includes(id))){
      await state.db.collection("trips").doc(t.id).update({companions: t.companions.filter(c => c !== id)});
    }
    await state.db.collection("companions").doc(id).delete();
  } catch(err){ state.compErr = "刪除失敗，請稍後再試。"; }
  state.compConfirmDel = null; renderPanel();
}

function doneTrips(){ return state.trips.filter(t => ["v","o"].includes(tripStatus(t))); }
function renderListView(dbNote){
  const V = $("#stampsView"), v = state.view;
  const loading = !state.tripsLoaded && !state.dbNote ? `<div class="empty">載入旅程中…</div>` : "";
  const byStartDesc = (a,b) => (b.start||"9999").localeCompare(a.start||"9999");
  let head = "", body = "";
  if (v === "stamps"){
    const list = [...state.trips].sort(byStartDesc);
    head = `<span class="kana">STAMP BOOK</span><h2>我的集章冊</h2>`;
    body = list.length ? `<div class="trips">${list.map(t => tripCard(t, false)).join("")}</div>` :
      `<div class="empty"><div class="big">🧳</div>還沒有任何印章。<br>回到世界地圖點一個國家，就能加入第一本旅遊手冊。</div>`;

/* ---------- GitHub data store (data/*.json in this repo) ---------- */
const GH = { owner: "Siderpan", repo: "travel-map", branch: "main", dir: "data/" };
const TOKEN_KEY = "travelmap.ghToken";
function getToken(){ try { return localStorage.getItem(TOKEN_KEY) || ""; } catch(e){ return ""; } }
function setToken(t){ try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch(e){} }
function makeGhDb(){
  const cache = {}, shas = {}, subs = {}, loading = {};
  const file = c => GH.dir + c + ".json";
  const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), ch => ch.charCodeAt(0)));
  const b64enc = s => { let bin = ""; new TextEncoder().encode(s).forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };
  const api = (path, opts = {}) => fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}` + (opts.method ? "" : `?ref=${GH.branch}&t=${Date.now()}`), {
    ...opts, cache: "no-store",
    headers: {Accept: "application/vnd.github+json", ...(getToken() ? {Authorization: "Bearer " + getToken()} : {})}
  });
  async function readRemote(c){
    const r = await api(file(c));
    if (r.status === 404){ shas[c] = null; return []; }
    if (!r.ok) throw {code: r.status === 401 || r.status === 403 ? "auth" : "unavailable"};
    const j = await r.json(); shas[c] = j.sha; return JSON.parse(b64dec(j.content));
  }
  async function readPublic(c){
    const r = await fetch(file(c) + "?t=" + Date.now(), {cache: "no-store"});
    if (r.status === 404) return [];
    if (!r.ok) throw {code: "unavailable"};
    return r.json();
  }
  function emit(c){
    const snap = {docs: (cache[c] || []).map(o => { const {id, ...rest} = o; return {id: String(id), exists: true, data: () => rest}; }), metadata: {fromCache: false, hasPendingWrites: false}};
    (subs[c] || []).forEach(s => s.next(snap));
  }
  async function load(c){
    try {
      let arr;
      if (getToken()){ try { arr = await readRemote(c); } catch(e){ arr = await readPublic(c); } }
      else arr = await readPublic(c);
      cache[c] = Array.isArray(arr) ? arr : []; emit(c);
    } catch(e){ (subs[c] || []).forEach(s => s.error && s.error(e)); }
  }
  let queue = Promise.resolve();
  function mutate(c, fn){
    const run = async () => {
      if (!getToken()) throw {code: "invalid_argument", auth: true};
      for (let attempt = 0; attempt < 3; attempt++){
        let arr;
        try { arr = await readRemote(c); } catch(e){ if (e.code === "auth") throw {code: "invalid_argument", auth: true}; throw e; }
        const next = fn(arr.map(o => ({...o})));
        const body = {message: `travel-map: 更新 ${c}`, content: b64enc(JSON.stringify(next, null, 2) + "\n"), branch: GH.branch};
        if (shas[c]) body.sha = shas[c];
        const r = await api(file(c), {method: "PUT", body: JSON.stringify(body)});
        if (r.ok){ const j = await r.json(); shas[c] = j.content.sha; cache[c] = next; emit(c); return; }
        if (r.status === 401 || r.status === 403 || r.status === 404) throw {code: "invalid_argument", auth: true};
        if (r.status !== 409 && r.status !== 422) throw {code: "unavailable"};
      }
      throw {code: "unavailable"};
    };
    const p = queue.then(run, run); queue = p.catch(() => {}); return p;
  }
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  return {
    reload(){ return Promise.all(Object.keys(subs).map(load)); },
    collection: c => ({
      onSnapshot(next, error){
        (subs[c] = subs[c] || []).push({next, error});
        if (cache[c]) setTimeout(() => emit(c), 0); else if (!loading[c]){ loading[c] = true; load(c); }
        return () => {};
      },
      doc(id){
        id = id || newId();
        return { id,
          set: data => mutate(c, arr => { const o = {id, ...data}; const i = arr.findIndex(x => x.id === id); if (i >= 0) arr[i] = o; else arr.push(o); return arr; }),
          update: data => mutate(c, arr => { const i = arr.findIndex(x => x.id === id); if (i < 0) throw {code: "invalid_argument"}; arr[i] = {...arr[i], ...data}; return arr; }),
          delete: () => mutate(c, arr => arr.filter(x => x.id !== id))
        };
      }
    })
  };
}
async function checkToken(t){
  const r = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}`, {headers: {Accept: "application/vnd.github+json", Authorization: "Bearer " + t}, cache: "no-store"});
  if (!r.ok) return false;
  const j = await r.json(); return !!(j.permissions && j.permissions.push);
}

async function initDb(){
  const db = makeGhDb();
  state.db = db;
  state.canEdit = !!getToken();
  const timer = setTimeout(() => { if (!state.tripsLoaded){ state.dbNote = "旅程資料暫時連不上，稍後會自動更新。"; renderPanel(); } }, 10000);
  db.collection("companions").onSnapshot(snap => {
    state.companions = snap.docs.map(d => { const x = d.data() || {}; return {id: d.id, name: String(x.name || "").slice(0, 20) || "旅伴", emoji: AVATARS.includes(x.emoji) ? x.emoji : AVATARS[0], createdAt: String(x.createdAt || ""), order: typeof x.order === "number" ? x.order : null}; })
      .sort((a, b) => ((a.order ?? 1e9) - (b.order ?? 1e9)) || a.createdAt.localeCompare(b.createdAt));
    if (state.sortIds){ const ids = new Set(state.companions.map(c => c.id)); state.sortIds = state.sortIds.filter(id => ids.has(id)).concat(state.companions.map(c => c.id).filter(id => !state.sortIds.includes(id))); }
    state.compLoaded = true; renderPanel();
  }, () => { state.compLoaded = true; });
  db.collection("trips").onSnapshot(snap => {
    if (!snap.metadata.fromCache){ clearTimeout(timer); if (state.dbNote.startsWith("旅程資料暫時")) state.dbNote = ""; }
    applyTrips(snap.docs);
  }, err => {
    clearTimeout(timer);
    state.dbNote = err && err.code === "revoked" ? "目前無法讀取旅程資料。" : "旅程資料讀取失敗，請重新整理頁面。";
    state.tripsLoaded = true; renderPanel();
  });
}

function openCrew(tripId){
  const t = state.trips.find(x => x.id === tripId); if (!t) return;
  state.crew = {id: tripId, ids: [...(t.companions || [])], saving: false, err: ""};
  renderCrew(); $("#crewDlg").hidden = false;
}
function renderCrew(){
  const c = state.crew; if (!c) return;
  const t = state.trips.find(x => x.id === c.id) || {};
  const qv = $("#crewQuick") ? $("#crewQuick").value : "";
  $("#crewBox").innerHTML = `
    <h2 id="crewTitle" style="font-size:20px">👫 這趟的旅伴</h2>
    <p>${esc(t.title || "未命名旅程")}・${esc(fmtRange(t))}</p>
    <div class="crewpick">
      <span class="cchip" style="cursor:default;background:var(--sun-soft)"><span class="av me">我</span>我</span>
      ${state.companions.map(p => `<button type="button" class="cchip" data-cp="${esc(p.id)}" aria-pressed="${c.ids.includes(p.id)}">${avatar(p)}${esc(p.name)}</button>`).join("")}
    </div>
    ${state.companions.length ? "" : `<p>還沒有旅伴，可以直接在下面新增。</p>`}
    <div class="quick"><input id="crewQuick" maxlength="20" placeholder="新增旅伴名字" value="${esc(qv)}"><button type="button" class="btn sm sun" id="crewAdd">＋ 加入</button></div>
    ${c.err ? `<div class="err">${esc(c.err)}</div>` : ""}
    <div class="dlgacts"><button class="btn mint" id="crewSave" ${c.saving ? "disabled" : ""}>${c.saving ? "儲存中…" : "💾 儲存"}</button><button class="btn ghost" id="crewClose">取消</button></div>`;
}
async function crewQuickAdd(){
  const q = $("#crewQuick"); const name = (q && q.value || "").trim(); if (!name) return;
  const id = await createCompanion(name, AVATARS[state.companions.length % AVATARS.length]);
  if (id && state.crew){ state.crew.ids.push(id); }
  if (q) q.value = ""; renderCrew(); const q2 = $("#crewQuick"); if (q2) q2.focus();
}
$("#crewDlg").addEventListener("click", async e => {
  const c = state.crew; if (!c) return;
  if (e.target.id === "crewDlg" || e.target.closest("#crewClose")){ $("#crewDlg").hidden = true; state.crew = null; return; }
  const b = e.target.closest("[data-cp]");
  if (b){ const id = b.dataset.cp, i = c.ids.indexOf(id); if (i >= 0) c.ids.splice(i, 1); else c.ids.push(id); renderCrew(); return; }
  if (e.target.closest("#crewAdd")){ crewQuickAdd(); return; }
  if (e.target.closest("#crewSave")){
    c.saving = true; c.err = ""; renderCrew();
    try {
      await state.db.collection("trips").doc(c.id).update({companions: c.ids.filter(id => compById(id)), updatedAt: new Date().toISOString()});
      $("#crewDlg").hidden = true; state.crew = null; return;
    } catch(err){ c.err = compErrText(err); }
    c.saving = false; renderCrew();
  }
});
$("#crewDlg").addEventListener("keydown", e => { if (e.target.id === "crewQuick" && e.key === "Enter"){ e.preventDefault(); crewQuickAdd(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.crew){ $("#crewDlg").hidden = true; state.crew = null; } });

/* ---------- admin (GitHub token) ---------- */
function renderAdmin(msg){
  const t = getToken();
  $("#adminBtn").classList.toggle("on", !!t);
  $("#adminBody").innerHTML = t ? `
    <p>✅ 這個瀏覽器已開啟管理模式，可以新增、修改旅程與旅伴。每次儲存都會寫進 GitHub 上的資料檔，網站約 1 分鐘後更新。</p>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ""}
    <div class="dlgacts"><button class="btn pink" id="adminLogout">登出管理模式</button><button class="btn ghost" id="adminClose">關閉</button></div>` : `
    <p>想新增或修改旅程，需要一把 GitHub「金鑰」證明你是這個網站的主人。只要做一次，金鑰只存在這台裝置的瀏覽器裡。</p>
    <ol class="steps">
      <li><b>打開 GitHub 的產生金鑰頁面</b>（要先登入 GitHub）
        <a class="btn sky sm" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">開啟金鑰頁面 ↗</a></li>
      <li><b>Token name</b> 隨便取個名字，例如「旅行地圖」。<br><b>Expiration</b>（有效期限）選久一點，到期後再回來換一把。</li>
      <li><b>Repository access</b> 選「Only select repositories」，再從下拉選單選 <code>${GH.repo}</code>。</li>
      <li>往下找到 <b>Permissions</b> → <b>Repository permissions</b> → <b>Contents</b>，把右邊的選單改成「Read and write」。</li>
      <li>拉到最下面按綠色的 <b>Generate token</b>，複製 <code>github_pat_</code> 開頭的那一長串，貼到下面。</li>
    </ol>
    <label class="tokfield">貼上金鑰<input id="tokenInput" type="password" autocomplete="off" placeholder="github_pat_…"></label>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ""}
    <div class="dlgacts"><button class="btn mint" id="adminSave">開啟管理模式</button><button class="btn ghost" id="adminClose">關閉</button></div>`;
}
$("#adminBtn").addEventListener("click", () => { renderAdmin(); $("#adminDlg").hidden = false; const i = $("#tokenInput"); if (i) i.focus(); });
$("#adminDlg").addEventListener("click", async e => {
  if (e.target.id === "adminDlg" || e.target.closest("#adminClose")){ $("#adminDlg").hidden = true; return; }
  if (e.target.closest("#adminLogout")){ setToken(""); state.canEdit = false; state.editing = null; state.compForm = null; state.sortIds = null; renderAdmin(); renderPanel(); return; }
  if (e.target.closest("#adminSave")){
    const t = ($("#tokenInput").value || "").trim(); if (!t) return;
    e.target.closest("#adminSave").disabled = true;
    let ok = false; try { ok = await checkToken(t); } catch(_){}
    if (!ok){ renderAdmin("這個金鑰無法寫入 " + GH.owner + "/" + GH.repo + "，請確認權限設定。"); return; }
    setToken(t); state.canEdit = true; state.readOnly = false; state.dbNote = "";
    renderAdmin(); renderPanel(); state.db.reload();
    setTimeout(() => { $("#adminDlg").hidden = true; }, 900);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#adminDlg").hidden = true; });
$("#adminBtn").classList.toggle("on", !!getToken());

boot();
})();
</script>
